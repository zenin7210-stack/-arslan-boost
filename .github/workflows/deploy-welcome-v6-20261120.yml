name: ARSLAN BOOST welcome banner and compact start v6
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-welcome-v6-20261120.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: arslan-boost-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore precise tested November 20 production source
        uses: actions/download-artifact@v4
        with:
          name: arslan-boost-v3-verified-source
          run-id: 44702451221
          repository: zenin7210-stack/-arslan-boost
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release

      - name: Verify locked baseline and patch source checksums
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '94c59e327532f1f75931d764f60d263efba85229c8fe9bf74c2b238c8c278ced' release/src/worker.mjs \
            'd03c894fa2e5384de36e2ef63ecad25ae5b7b9d5a667368abe48a3582d9b387f' release/src/p2p.mjs \
            '995dba70936043ea4ba4704478d0e84d632c5363bd0c886d9c280c31b318c73d' release/tests/p2p.test.mjs \
            '5abec56a8932e47a849b4b81e9fb3157a4c4a6d6224174e75371f9477cc707f0' release/wrangler.production.jsonc | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, lzma, base64
          b64=''.join(Path('releases/admin-booking-hotfix-v5-20261120.xz64.txt').read_text().split())
          patch=lzma.decompress(base64.b64decode(b64,validate=True))
          expect='7444e19ef995e57e23341d828ce568782604c29f1d33532fc2bcfca41548732d'
          if hashlib.sha256(patch).hexdigest()!=expect:
              raise SystemExit('Unrecognized patch bytes: refusing deployment')
          Path('/tmp/admin-booking-v5.patch').write_bytes(patch)
          PY
          cd release
          git init -q
          git apply --check /tmp/admin-booking-v5.patch
          git apply /tmp/admin-booking-v5.patch
          printf '%s  %s\n' \
            '32f07c02130c7d120cf605ee5103f312e866034efb6197198c52f8422076e67d' src/worker.mjs \
            '411e3835964d4df65a23c05be4f744da8f44f7537aed401d569054533320b76d' src/p2p.mjs \
            '681f60735f73609b625d5a117957020618203faf99f563065c07e62883543e76' migrations/0018_release_paid_order_holds.sql | sha256sum -c -
          echo "PASS: production source and payment-safe hotfix hashes verified"

      - name: Generate Telegram-friendly admin photo banners from original product artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow==11.3.0
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          covers=Path('release/public/assets/donat')
          output=covers/'admin'
          output.mkdir(exist_ok=True)
          files=list(covers.glob('cover-*.webp'))
          if len(files)<8: raise RuntimeError('Product artwork incomplete')
          for item in files:
              with Image.open(item) as im:
                  im.convert('RGB').save(output/(item.stem+'.jpg'),format='JPEG',quality=91,optimize=True,subsampling=0)
          print('Original banners untouched; JPEG Telegram previews:',len(files))
          PY
          test -s release/public/assets/donat/admin/cover-gold-rinok.jpg
          test -s release/public/assets/donat/admin/cover-premium.jpg

      - name: Replace only the /start and /preview caption; generate clean wide banner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance
          import hashlib
          base=Path('release')
          js=base/'src/worker.mjs'
          source=js.read_text()
          begin=source.index("      const greeting='⚡ ARSLAN BOOST’ga xush kelibsiz!")
          end=source.index("\n      try {",begin)
          greeting=r"""      const greeting='⚡ ARSLAN BOOST’ga xush kelibsiz!\n\n🚀 Rank Boost — Standoff 2\nDonat Shop — o‘yin valyutalari\n💰 Gold sotish — bozor orqali\n\nBuyurtma berish uchun Mini App’ni oching.';"""
          custom=r"""      const customGreeting='<tg-emoji emoji-id="5404614161831341267">⚡</tg-emoji> <b>ARSLAN BOOST’ga xush kelibsiz!</b>\n\n<tg-emoji emoji-id="5404812288672703936">🚀</tg-emoji> <b>Rank Boost</b> — Standoff 2\n<b>Donat Shop</b> — o‘yin valyutalari\n<tg-emoji emoji-id="5123093405064234078">💰</tg-emoji> <b>Gold sotish</b> — bozor orqali\n\n<i>Buyurtma berish uchun Mini App’ni oching.</i>';"""
          photo="      const photo=new URL('assets/start-welcome-v6.jpg',url).href;"
          replacement="\n".join([greeting,custom,photo])
          original=source[begin:end]
          assert original.count("const photo=new URL('assets/start-banner.jpg',url)") == 1, 'Unexpected greeting code'
          assert '5404614161831341267' in original and '5123093405064234078' in original
          js.write_text(source[:begin]+replacement+source[end:])

          # Source V5 holds an older screenshot rather than a clean JPEG.
          # Remove screenshot chrome and export a proper full-bleed horizontal image.
          img=base/'public/assets/start-banner.jpg'
          expected='be651e28a5e070394594e4ba250294df243def3dd753537b116498cba0f11928'
          assert hashlib.sha256(img.read_bytes()).hexdigest() == expected, 'Banner baseline changed'
          with Image.open(img) as im:
              assert im.size==(998,594), 'Unexpected legacy banner dimensions'
              out=im.convert('RGB').crop((12,48,988,536)).resize((1280,640),Image.Resampling.LANCZOS)
              out=ImageEnhance.Contrast(out).enhance(1.10)
              out=ImageEnhance.Sharpness(out).enhance(1.20)
              out.save(base/'public/assets/start-welcome-v6.jpg','JPEG',quality=88,optimize=True,progressive=True)
          assert (base/'public/assets/start-welcome-v6.jpg').stat().st_size>10000

          test=base/'tests/p2p.test.mjs'
          t=test.read_text()
          assert "assert.match(greeting.body.caption,/o‘z Gold’ingizni sotishingiz mumkin/);" in t
          assert "assert.match(greeting.body.photo,/\\/assets\\/start-banner\\.jpg$/);" in t
          t=t.replace("assert.match(greeting.body.caption,/o‘z Gold’ingizni sotishingiz mumkin/);",
                      "assert.match(greeting.body.caption,/<b>Gold sotish<\\/b>/);")
          t=t.replace("assert.match(greeting.body.photo,/\\/assets\\/start-banner\\.jpg$/);",
                      "assert.match(greeting.body.photo,/\\/assets\\/start-welcome-v6\\.jpg$/);")
          test.write_text(t)
          print('Updated /start and /preview, photo asset and greeting regression tests')
          PY
          node --check release/src/worker.mjs
          test -s release/public/assets/start-welcome-v6.jpg

      - name: Run regression suite and verify guardrails
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          node --check src/p2p.mjs
          node --check src/worker.mjs
          npm test > /tmp/admin-v5-tests.txt 2>&1 || { tail -80 /tmp/admin-v5-tests.txt; exit 1; }
          tail -22 /tmp/admin-v5-tests.txt
          grep -q '^# fail 0$' /tmp/admin-v5-tests.txt
          grep -q '^# pass 77$' /tmp/admin-v5-tests.txt
          grep -q '^# skipped 26$' /tmp/admin-v5-tests.txt
          node - <<'JS'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('wrangler.production.jsonc','utf8'));
          const p=fs.readFileSync('src/p2p.mjs','utf8');
          const w=fs.readFileSync('src/worker.mjs','utf8');
          const m=fs.readFileSync('migrations/0018_release_paid_order_holds.sql','utf8');
          if(c.name!=='arslan-boost-bot'||c.account_id!=='b4cabfc322b7108c44aa96a7bae0010c'
              ||c.d1_databases?.[0]?.database_name!=='arslan-boost-payments'
              ||c.keep_vars!==true||Object.hasOwn(c.vars||{},'P2P_MODE'))throw Error('Unsafe Cloudflare config');
          if(!p.includes('const HOLD_SECONDS = 10 * 60;')||!p.includes('const TRANSFER_STEPS = [0];')
              ||!p.includes('Принять оплату · сверить банк'))throw Error('Bank safety missing');
          if(!w.includes('work:finish:')||!w.includes("sendPhoto")||!w.includes("handleCostReply"))
              throw Error('New admin actions missing');
          if(m.includes('DROP TABLE')||m.includes('DELETE FROM')||!m.includes('DROP TRIGGER IF EXISTS arslan_one_active_donat'))
              throw Error('Migration not strictly limited to indefinite order locks');
          console.log('PASS: exact 10-minute P2P hold, admin callbacks, and non-destructive migration');
          JS

      - name: Verify actual live frontend unchanged before touching D1
        shell: bash
        run: |
          set -euo pipefail
          URL='https://arslan-boost-bot.zenin7210.workers.dev'
          for f in index.html app.js assets/p2p.js; do
            mkdir -p "/tmp/live/$(dirname "$f")"
            curl -fsSL --retry 2 --max-time 25 "$URL/$f?v=pre-admin-booking-v5" -o "/tmp/live/$f"
            cmp -s "release/public/$f" "/tmp/live/$f" || {
              echo "::error::Live frontend changed since snapshot: $f. Refusing database migration."
              exit 1
            }
          done
          echo 'PASS: current live Mini App matches frozen snapshot (no catalog UI changed)'

      - name: Verify private bank settings and current D1 indexes before migration
        id: baseline
        working-directory: release
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          curl -fsSL --max-time 25 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/accounts/b4cabfc322b7108c44aa96a7bae0010c/workers/scripts/arslan-boost-bot/settings' > /tmp/private-settings.json
          node - <<'JS'
          const j=require('/tmp/private-settings.json');
          if(!j.success)throw Error('Cannot inspect Worker settings');
          const b=j.result?.bindings||[];
          if(!b.some(x=>x.name==='P2P_MODE'&&x.type==='plain_text'&&x.text==='private'))
            throw Error('Bank payment mode changed; refusing deploy');
          for(const k of ['ADMIN_ID','P2P_CARDS','P2P_HUMO_SECRET','P2P_CARDXABAR_SECRET'])
            if(!b.some(x=>x.name===k))throw Error('Missing private bank binding: '+k);
          console.log('PASS: private payment sources and admin bindings');
          JS
          npx --yes wrangler@4 d1 execute arslan-boost-payments --remote --config wrangler.production.jsonc --json \
            --command 'SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1' > /tmp/v5-ledger.json
          npx --yes wrangler@4 d1 execute arslan-boost-payments --remote --config wrangler.production.jsonc --json \
            --command "SELECT name, type FROM sqlite_master WHERE name IN ('arslan_one_active_boost','arslan_one_active_donat','p2p_one_open_invoice','p2p_paid_requires_bank_event','p2p_settle_on_paid','p2p_match_incoming')" > /tmp/v5-schema.json
          node - <<'JS'
          const fs=require('fs');
          function rows(f){const j=JSON.parse(fs.readFileSync(f));return (Array.isArray(j)?j:[j]).flatMap(x=>x.results||[]);}
          const last=rows('/tmp/v5-ledger.json')[0]?.name;
          if(!['0017_support_dialogs.sql','0018_release_paid_order_holds.sql'].includes(last))
              throw Error('Unexpected live migration '+last+'; no changes made');
          const names=new Set(rows('/tmp/v5-schema.json').map(x=>x.name));
          for(const n of ['p2p_one_open_invoice','p2p_paid_requires_bank_event','p2p_settle_on_paid','p2p_match_incoming'])
              if(!names.has(n)) throw Error('Payment safety index or trigger missing: '+n);
          const old=last==='0017_support_dialogs.sql';
          const existing=['arslan_one_active_boost','arslan_one_active_donat'].filter(n=>names.has(n));
          // The owner may already have removed one of the stale triggers manually.
          // The new migration uses DROP TRIGGER IF EXISTS and is safe in either state.
          console.log('Legacy order-hold triggers still installed:',existing.join(', ')||'none');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'needs_migration='+old+'\n');
          console.log(old?'PASS: D1 holds identified; migration 0018 required':'PASS: migration already applied');
          JS

      - name: Record production D1 time-travel recovery bookmark
        if: steps.baseline.outputs.needs_migration == 'true'
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 time-travel info arslan-boost-payments --config wrangler.production.jsonc

      - name: Drop only indefinite active-order triggers (preserve bank evidence and paid orders)
        if: steps.baseline.outputs.needs_migration == 'true'
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply arslan-boost-payments --remote --config wrangler.production.jsonc

      - name: Verify post-migration protected D1 schema
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute arslan-boost-payments --remote --config wrangler.production.jsonc --json \
            --command "SELECT name FROM sqlite_master WHERE name IN ('arslan_one_active_boost','arslan_one_active_donat','p2p_one_open_invoice','p2p_paid_requires_bank_event','p2p_settle_on_paid','p2p_match_incoming')" > /tmp/v5-after.json
          npx --yes wrangler@4 d1 execute arslan-boost-payments --remote --config wrangler.production.jsonc --json \
            --command 'SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1' > /tmp/v5-after-ledger.json
          node - <<'JS'
          const fs=require('fs');
          const rows=f=>{const j=JSON.parse(fs.readFileSync(f));return(Array.isArray(j)?j:[j]).flatMap(x=>x.results||[])};
          if(rows('/tmp/v5-after-ledger.json')[0]?.name!=='0018_release_paid_order_holds.sql')
              throw Error('Migration 0018 not installed');
          const n=new Set(rows('/tmp/v5-after.json').map(x=>x.name));
          for(const old of ['arslan_one_active_boost','arslan_one_active_donat'])
              if(n.has(old))throw Error('Indefinite hold remains: '+old);
          for(const safe of ['p2p_one_open_invoice','p2p_paid_requires_bank_event','p2p_settle_on_paid','p2p_match_incoming'])
              if(!n.has(safe))throw Error('Missing payment protection '+safe);
          console.log('PASS: no indefinite order blocks; bank safety retained');
          JS

      - name: Deploy strictly verified Worker and existing original Mini App
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.production.jsonc --keep-vars

      - name: Verify production health, product images and admin assets
        shell: bash
        run: |
          set -euo pipefail
          URL='https://arslan-boost-bot.zenin7210.workers.dev'
          for attempt in {1..12}; do
            if curl -fsSL --max-time 20 "$URL/healthz" -o /tmp/v5-health.json && \
               curl -fsSL --max-time 20 "$URL/assets/donat/admin/cover-gold-rinok.jpg" -o /tmp/v5-cover.jpg && \
               cmp -s /tmp/v5-cover.jpg release/public/assets/donat/admin/cover-gold-rinok.jpg && \
               curl -fsSL --max-time 20 "$URL/assets/start-welcome-v6.jpg" -o /tmp/v6-start.jpg && \
               cmp -s /tmp/v6-start.jpg release/public/assets/start-welcome-v6.jpg; then
              node - <<'JS'
          const j=require('/tmp/v5-health.json');
          if(j.ok!==true||j.paymentsEnabled!==true)throw Error('Production unhealthy');
          console.log('PASS: healthy Worker, payments enabled, welcome JPEG and admin banners deployed');
          JS
              exit 0
            fi
            sleep 4
          done
          echo '::error::Production did not return expected release assets'
          exit 1
