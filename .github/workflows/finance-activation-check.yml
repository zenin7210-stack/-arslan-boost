name: Verify private finance group activation
on:
  push:
    branches: [finance-deploy-preflight]
    paths: ['.github/workflows/finance-activation-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify group menu, dashboard, HUMO configuration and marketplace health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request,subprocess
          root='https://api.cloudflare.com/client/v4/accounts/b4cabfc322b7108c44aa96a7bae0010c'
          def req(path,body=None):
              q=urllib.request.Request(root+path,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'})
              with urllib.request.urlopen(q,timeout=20) as r:j=json.load(r)
              assert j['success']
              return j['result']
          db=[d for d in req('/d1/database?name=arslan-finance-channel') if d['name']=='arslan-finance-channel'][0]['uuid']
          # Only the authenticated relay sets these markers after Telegram accepts the menu.
          # Check agreement within D1 and keep identifiers and financial data out of CI logs.
          sql = """
            SELECT EXISTS (
              SELECT 1 FROM fin_config AS c
              JOIN fin_config AS m ON m.k='menu_group' AND m.v=c.v
              JOIN fin_config AS d ON d.k='dashboard' AND CAST(d.v AS INTEGER)>0
              JOIN fin_config AS p ON p.k='humo_peer' AND CAST(p.v AS INTEGER)>0
              JOIN fin_config AS k ON k.k='card' AND length(k.v)=4
              JOIN fin_config AS t ON t.k='track_from' AND length(t.v)>0
              WHERE c.k='channel'
            ) AS ready
          """
          for attempt in range(30):
              result=req('/d1/database/'+db+'/query',{'sql':sql})
              if result[0]['results'][0]['ready']:
                  break
              if attempt==29:
                  raise SystemExit('Private finance group menu activation not verified')
              time.sleep(5)
          print('PASS: Telegram accepted the scoped menu and published the dashboard in the bound finance group; HUMO configured.')
          h=json.loads(subprocess.check_output(['curl','-fsSL','--max-time','20','https://arslan-boost-bot.zenin7210.workers.dev/healthz']))
          assert h['ok'] and h['paymentsEnabled']
          print('PASS: marketplace healthy and payments enabled.')
          PY
