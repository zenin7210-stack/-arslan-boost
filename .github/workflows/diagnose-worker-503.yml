name: Read Cloudflare 503 telemetry, no customer payloads
on:
  push:
    branches: [update/arslan-boost-next-20261119]
    paths: [.github/workflows/diagnose-worker-503.yml]
permissions: {contents: read}
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Query only sanitized Cloudflare Workers error metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node - <<'JS' > /tmp/query.json
          const now=Date.now();
          process.stdout.write(JSON.stringify({queryId:"card-checkout-diagnostic-20261119",view:"events",limit:100,dry:true,
            timeframe:{from:now-60*60*1000,to:now},
            parameters:{datasets:["cloudflare-workers"],filters:[
              {key:"$metadata.service",operation:"eq",type:"string",value:"arslan-boost-bot"}
            ],filterCombination:"and"}
          }));
          JS
          status="$(curl -sS --max-time 25 -w '%{http_code}' -o /tmp/telemetry.json \
            -X POST 'https://api.cloudflare.com/client/v4/accounts/b4cabfc322b7108c44aa96a7bae0010c/workers/observability/telemetry/query' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/query.json)"
          echo "Telemetry status: $status"
          node - <<'JS'
          const fs=require('node:fs');
          const j=JSON.parse(fs.readFileSync('/tmp/telemetry.json','utf8'));
          if(j.success===false){console.log('API error codes:',(j.errors||[]).map(e=>e.code||e.message?.slice(0,180)));console.log('response keys:',Object.keys(j),'details:',JSON.stringify(j).slice(0,650));process.exit(0);}
          const root=j.result?.run||j.result||{};
          const events=root.events?.events || root.events || [];
          console.log('result keys:',Object.keys(root).filter(k=>!['source','invocations'].includes(k)));
          console.log('events returned:',Array.isArray(events)?events.length:'not-an-array');
          if(Array.isArray(events)) {
            const safe=events.map(e=>e?.$metadata||{}).filter(m=>m.service==='arslan-boost-bot')
              .map(m=>({statusCode:m.statusCode,level:m.level,type:m.type,
                message:m.message?.startsWith('ARSLAN BOOST Worker failed')?'generic Worker caught error':undefined,
                errorType:m.errorTemplate?.slice(0,80)}));
            console.log('safe metadata:',JSON.stringify(safe.slice(0,35)));
          }
          JS
