name: One-time read-only audit of 25000 UZS test
on:
  push:
    branches:
      - diagnostics/readonly-payment-25000
    paths:
      - .github/workflows/payment-audit-readonly.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unpack exact approved v3 configuration
        run: |
          set -euo pipefail
          mkdir -p audit
          unzip -q ARSLAN_BOOST_PRO_SAFE_v3_2026-11-19.zip -d audit
          test -f audit/arslan-boost-cloudflare/wrangler.production.jsonc
      - name: Read-only D1 status of recent test transfer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: audit/arslan-boost-cloudflare
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4 d1 execute arslan-boost-payments --remote --config wrangler.production.jsonc --json --command "SELECT status,COUNT(*) AS n FROM invoices WHERE unique_amount=25000 AND created_at>=unixepoch('now')-10800 GROUP BY status" > /tmp/invoices.json
          npx --yes wrangler@4 d1 execute arslan-boost-payments --remote --config wrangler.production.jsonc --json --command "SELECT COUNT(*) AS events, COALESCE(SUM(CASE WHEN invoice_id IS NOT NULL THEN 1 ELSE 0 END),0) AS matched FROM p2p_incoming WHERE amount=25000 AND occurred_at>=unixepoch('now')-10800" > /tmp/incoming.json
          npx --yes wrangler@4 d1 execute arslan-boost-payments --remote --config wrangler.production.jsonc --json --command "SELECT COUNT(*) AS waiting FROM p2p_manual_queue m JOIN invoices i ON i.id=m.invoice_id WHERE i.unique_amount=25000 AND i.created_at>=unixepoch('now')-10800" > /tmp/queue.json
          npx --yes wrangler@4 d1 execute arslan-boost-payments --remote --config wrangler.production.jsonc --json --command "SELECT COUNT(*) AS cancelled FROM p2p_invoice_cancellations c JOIN invoices i ON i.id=c.invoice_id WHERE i.unique_amount=25000 AND i.created_at>=unixepoch('now')-10800" > /tmp/cancelled.json
          node - <<'JS'
          const fs=require('fs');
          function data(p) {const v=JSON.parse(fs.readFileSync(p,'utf8'));return (Array.isArray(v)?v:[v]).flatMap(x=>x.results||[]);}
          console.log('READ_ONLY_AUDIT='+JSON.stringify({invoice_status:data('/tmp/invoices.json'),incoming:data('/tmp/incoming.json'),manual_queue:data('/tmp/queue.json'),cancelled:data('/tmp/cancelled.json')}));
          JS
