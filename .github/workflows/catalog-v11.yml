name: Arslan Boost • storefront V11
on:
  push:
    branches: [main]
    paths: ['releases/catalog-v11/**', '.github/workflows/catalog-v11.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arslan-boost-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble and verify production source
        run: |
          python -m pip install -q Pillow==11.3.0 playwright==1.55.0
          python releases/catalog-v11/build.py release
      - name: Run regression suite
        working-directory: release
        run: npm test
      - name: Test mobile checkout, language and order status
        working-directory: release
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: python tests/catalog-browser.py
      - name: Check current production version
        id: current
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, urllib.request
          cfg=json.load(open('wrangler.production.jsonc'))
          origin=cfg['vars']['MINIAPP_URL'].split('/?')[0]
          req=urllib.request.Request(f"https://api.cloudflare.com/client/v4/accounts/{cfg['account_id']}/workers/scripts/{cfg['name']}/deployments",
              headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          assert data['success']
          latest=max(data['result']['deployments'],key=lambda d:d['created_on'])
          versions=latest['versions']
          assert len(versions)==1 and versions[0]['percentage']==100, 'A rollout is in progress'
          current=versions[0]['version_id']
          def digest(b): return hashlib.sha256(b).hexdigest()
          with urllib.request.urlopen(origin+'/index.html?verify='+os.environ['GITHUB_SHA'],timeout=30) as r:
              live=digest(r.read())
          ready=current=='229877ba-9651-49e4-a3fe-545b9a652533' and live=='a6a311cfe1ba2dee99bf20200b4b7e0189c8862f28cf3696c6515fecb4de60b7'
          same=live==digest(open('public/index.html','rb').read())
          if not ready and not same: raise RuntimeError('Active production build differs from the verified release')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: print('deploy='+str(ready).lower(),file=output)
          PY
      - name: Deploy storefront and Worker
        if: steps.current.outputs.deploy == 'true'
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.166.0 deploy --config wrangler.production.jsonc --keep-vars
      - name: Confirm public catalog, images and live health
        working-directory: release
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          base=json.load(open('wrangler.production.jsonc'))['vars']['MINIAPP_URL'].split('/?')[0]
          root=Path('public')
          files=['index.html','app.js','assets/donat/shop.js','assets/donat/shop.css','assets/donat/catalog.json']
          files+=sorted(str(p.relative_to(root)) for p in (root/'assets/donat/catalog').glob('*.webp'))
          for attempt in range(8):
              try:
                  for path in files:
                      url=base+'/'+path+'?release='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt)
                      with urllib.request.urlopen(url,timeout=20) as r: body=r.read()
                      if body!=(root/path).read_bytes(): raise ValueError('Unexpected live asset: '+path)
                  with urllib.request.urlopen(base+'/healthz',timeout=20) as r: assert json.load(r)['ok']
                  break
              except Exception:
                  if attempt==7: raise
                  time.sleep(5)
          print(f'Verified {len(files)} live files and /healthz.')
          PY
