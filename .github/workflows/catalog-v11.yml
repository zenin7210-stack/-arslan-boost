name: Arslan Boost • storefront V11
on:
  push:
    branches: [main]
    paths: ['releases/catalog-v11/**', '.github/workflows/catalog-v11.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arslan-boost-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble and verify production source
        run: |
          python -m pip install -q Pillow==11.3.0 playwright==1.55.0
          python releases/catalog-v11/build.py release
      - name: Run regression suite
        working-directory: release
        run: npm test
      - name: Test mobile checkout, language and order status
        working-directory: release
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: python tests/catalog-browser.py
      - name: Check current production version
        id: current
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          cfg=json.load(open('wrangler.production.jsonc'))
          origin=cfg['vars']['MINIAPP_URL'].split('/?')[0]
          req=urllib.request.Request(f"https://api.cloudflare.com/client/v4/accounts/{cfg['account_id']}/workers/scripts/{cfg['name']}/deployments",
              headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          assert data['success']
          latest=max(data['result']['deployments'],key=lambda d:d['created_on'])
          versions=latest['versions']
          assert len(versions)==1 and versions[0]['percentage']==100, 'A rollout is in progress'
          current=versions[0]['version_id']
          def digest(b): return hashlib.sha256(b).hexdigest()
          live=digest(subprocess.check_output(['curl','-fsSL','--retry','2','--max-time','25',
              origin+'/index.html?verify='+os.environ['GITHUB_SHA']]))
          ready=current=='55731c20-2167-4f9d-a471-6dd695dc967b' and live=='20b9cfaf637a886228af21e64d7285beaa48f3701f150a1dec3433fc54f4d93e'
          same=False
          if not ready and live==digest(open('public/index.html','rb').read()):
              marker='/healthz?chat_ai=1'
              check=subprocess.run(['curl','-fsSL','--max-time','25',origin+marker],capture_output=True)
              same=check.returncode==0 and json.loads(check.stdout).get('revision')=='shop-17'
          if not ready and not same: raise RuntimeError('Active production build differs from the verified release')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: print('deploy='+str(ready).lower(),file=output)
          PY
      - name: Deploy storefront and Worker
        if: steps.current.outputs.deploy == 'true'
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.166.0 deploy --config wrangler.production.jsonc --keep-vars
      - name: Confirm public catalog, images and live health
        working-directory: release
        run: |
          python - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path
          base=json.load(open('wrangler.production.jsonc'))['vars']['MINIAPP_URL'].split('/?')[0]
          root=Path('public')
          files=['index.html','app.js','assets/donat/shop.js','assets/donat/shop.css','assets/donat/catalog.json','assets/donat/catalog/chat-welcome.jpg']
          files+=sorted(str(p.relative_to(root)) for p in (root/'assets/donat/catalog').glob('*.webp'))
          def fetch(url):
              return subprocess.check_output(['curl','-fsSL','--retry','2','--max-time','25',url])
          for attempt in range(8):
              try:
                  for path in files:
                      url=base+'/'+path+'?release='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt)
                      body=fetch(url)
                      if body!=(root/path).read_bytes(): raise ValueError('Unexpected live asset: '+path)
                  assert json.loads(fetch(base+'/healthz'))['ok']
                  break
              except Exception:
                  if attempt==7: raise
                  time.sleep(5)
          print(f'Verified {len(files)} live files and /healthz.')
          PY
      - name: Verify Russian and Uzbek replies on the deployed AI binding
        working-directory: release
        run: |
          python - <<'PYTEST'
          import json, subprocess, time
          origin=json.load(open('wrangler.production.jsonc'))['vars']['MINIAPP_URL'].split('/?')[0]
          for i in range(40):
              probe=subprocess.run(['curl','-fsSL','--max-time','8',origin+'/healthz?chat_ai=1&t='+str(time.time_ns())],capture_output=True)
              if probe.returncode==0:
                  check=json.loads(probe.stdout)
                  if check.get('revision')=='shop-17' and check.get('uz') and check.get('ru'):
                      print('Live bilingual check:',json.dumps(check))
                      break
              time.sleep(8)
          else: raise RuntimeError('Live bilingual verification pending or unsuccessful')
          PYTEST
